name: Alerta vuelos Berlín

on:
  schedule:
    # Todos los días 11:17 UTC (08:17 en Argentina)
    - cron: "17 11 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para probar a mano

permissions:
  contents: write   # para commitear data/historial.json

concurrency:
  group: alerta-vuelos
  cancel-in-progress: false

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar ofertas
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerta.py

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "alerta-bot"
          git config user.email "alerta-bot@users.noreply.github.com"
          git add data/historial.json
          git diff --cached --quiet || git commit -m "historial $(date -u +%F)"
          git push
